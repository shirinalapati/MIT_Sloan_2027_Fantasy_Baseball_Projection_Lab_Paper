   <g id="text_1">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="12.6405" y="32.254837" transform="rotate(-0 12.6405 32.254837)">1  Metric</text>
   </g>
   <g id="text_2">
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 44.907356)">season-t value of a</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 51.855352)">public metric (e.g.,</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 59.419473)">sprint speed, ft/s)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="85.5432" y="32.254837" transform="rotate(-0 85.5432 32.254837)">2  History baseline</text>
   </g>
   <g id="text_4">
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(85.5432 44.291231)">ridge forecast from</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(85.5432 51.81757)">the target's own two-</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(85.5432 59.381691)">year history, age,</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(85.5432 66.945813)">playing time, park</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="158.4459" y="32.254837" transform="rotate(-0 158.4459 32.254837)">3  Add the metric</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(158.4459 44.869574)">the same model</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(158.4459 52.433695)">with one added</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(158.4459 59.41802)">input</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="231.3486" y="32.254837" transform="rotate(-0 231.3486 32.254837)">4  Paired test</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(231.3486 44.869574)">train on earlier</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(231.3486 51.81757)">seasons only; score</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(231.3486 59.381691)">the same players in</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(231.3486 66.983594)">t+1 (7 folds 2019–25;</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(231.3486 74.547715)">nested 2021–25)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="304.2513" y="32.254837" transform="rotate(-0 304.2513 32.254837)">5  Verdict</text>
   </g>
   <g id="text_10">
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(304.2513 44.291231)">Projection if every</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(304.2513 51.81757)">gate passes; else a</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(304.2513 60.035598)">label from the</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(304.2513 67.561938)">dashed rules</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="202.3326" y="115.137637" transform="rotate(-0 202.3326 115.137637)">Statistical gates (all must pass for Projection)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(202.3326 127.174031)">material: RMSE falls by ≥ 0.5% of the baseline RMSE</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(202.3326 134.77448)">consistent: ≥ 60% of folds improve, or the 95% CI is below 0</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(202.3326 142.302273)">not redundant: survives the feature-family step</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(202.3326 149.866394)">stable: the coefficient changes sign fewer than 2 times</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(202.3326 157.430515)">coverage ≥ 70%; no harm in most large subgroups</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="12.6405" y="115.137637" transform="rotate(-0 12.6405 115.137637)">Human rule: role label</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 127.136249)">park, environment, age and</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 134.70037)">playing-time inputs are</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 142.916945)">labelled Context whatever</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 149.866394)">their lift (set in the metric</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 157.430515)">catalog, not learned)</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 7.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="104.4036" y="115.137637" transform="rotate(-0 104.4036 115.137637)">Human rule: process flag</text>
   </g>
   <g id="text_16">
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(104.4036 127.38764)">after a failed test, metrics</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(104.4036 134.738152)">flagged as process measures</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(104.4036 142.264491)">become Diagnostic; the rest</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(104.4036 149.866394)">become Exclude (for this</text>
    <text style="font-size: 6.2px; font-family: 'Arial'; fill: #52514e" transform="translate(104.4036 157.430515)">target only)</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="9.0135" y="192.05792" transform="rotate(-0 9.0135 192.05792)">Worked example: the same metric, two jobs (canonical 7-fold evaluation, outcomes 2019–2025)</text>
   </g>
   <g id="text_18">
    <text style="font-size: 6.7px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="9.0135" y="208.27412" transform="rotate(-0 9.0135 208.27412)">Sprint speed → next-season baserunning rate:  ΔRMSE −4.3% of baseline RMSE; 7 of 7 folds improved  →  Projection</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.7px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="9.0135" y="223.7696" transform="rotate(-0 9.0135 223.7696)">Sprint speed → next-season wOBA:  ΔRMSE +0.08%; 3 of 7 folds improved  →  Diagnostic  (year-to-year r = 0.92: stable, yet no added wOBA information)</text>
   </g>
