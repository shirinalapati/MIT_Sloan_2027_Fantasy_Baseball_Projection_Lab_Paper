   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="12.6405" y="44.609078" transform="rotate(-0 12.6405 44.609078)">1  Metric</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 60.847028)">season-t value</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 69.184891)">(e.g., sprint</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 78.213036)">speed, ft/s)</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="85.1805" y="44.609078" transform="rotate(-0 85.1805 44.609078)">2  Baseline</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(85.1805 60.111653)">ridge on the</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(85.1805 69.139797)">target's two-year</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(85.1805 78.167942)">history, age,</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(85.1805 87.196086)">playing time</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="157.7205" y="44.609078" transform="rotate(-0 157.7205 44.609078)">3  Add metric</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(157.7205 60.366606)">same model,</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(157.7205 69.875172)">one added</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(157.7205 78.211301)">input</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="230.2605" y="44.609078" transform="rotate(-0 230.2605 44.609078)">4  Paired test</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(230.2605 60.847028)">earlier seasons</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(230.2605 69.39475)">train; same</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(230.2605 78.167942)">players scored</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(230.2605 87.942446)">in season t+1</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="302.8005" y="44.609078" transform="rotate(-0 302.8005 44.609078)">5  Verdict</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(302.8005 60.156747)">Projection if all</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(302.8005 69.139797)">gates pass; else</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(302.8005 78.903317)">a human-rule</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(302.8005 87.931461)">label</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="12.6405" y="133.949889" transform="rotate(-0 12.6405 133.949889)">Statistical gates (all must pass for Projection)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 149.497557)">material: RMSE falls by ≥ 0.5% of the baseline RMSE        consistent: ≥ 60% of folds improve, or CI &lt; 0</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 158.525702)">not redundant: survives the greedy family step        stable: coefficient changes sign fewer than 2 times</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 167.553846)">coverage ≥ 70%        no material harm in at least half of the large subgroups</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="12.6405" y="215.349294" transform="rotate(-0 12.6405 215.349294)">Human rule: role label</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 230.851869)">park, environment, age and playing-time inputs</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(12.6405 240.658748)">are labelled Context whatever their lift</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.2px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="195.804" y="215.349294" transform="rotate(-0 195.804 215.349294)">Human rules: process flag and families</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(195.804 230.896963)">failed metrics with a process flag → Diagnostic,</text>
    <text style="font-size: 7.4px; font-family: 'Arial'; fill: #52514e" transform="translate(195.804 239.968467)">others → Exclude; families decide who competes</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="9.0135" y="273.704854" transform="rotate(-0 9.0135 273.704854)">Worked example: one metric, two jobs (canonical fold averages, outcomes 2019–2025)</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.8px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="9.0135" y="290.381805" transform="rotate(-0 9.0135 290.381805)">Sprint speed → baserunning rate: ΔRMSE −4.3%, 7 of 7 folds improved → Projection</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.8px; font-family: 'Arial'; text-anchor: start; fill: #0b0b0b" x="9.0135" y="306.264616" transform="rotate(-0 9.0135 306.264616)">Sprint speed → wOBA: ΔRMSE +0.08%, 3 of 7 folds improved → Diagnostic (year-to-year r = 0.92)</text>
   </g>
